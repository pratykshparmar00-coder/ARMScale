name: Keep Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret not set. Skipping ping."
          else
            echo "Pinging $RENDER_URL/health ..."
            curl -s -f "$RENDER_URL/health" || echo "Ping failed or server waking up"
          fi
